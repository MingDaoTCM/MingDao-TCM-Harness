# 明道中医 · 问诊台 桌面版打包 —— 与上游 MingDao-Harness/.github/workflows/desktop.yml 同构
#
# 触发：
#   · 打 tag（v*）      → 三平台构建 + 自动创建 GitHub Release（安装包长期保留在 Release 上）
#   · workflow_dispatch → 只构建、只上传工件，**不发版**（用于验证签名/公证与构建是否正常）
#
# 与上游的差别只有两处，都因为本项目是"下游层"：
#   ① 要**同时 checkout 内核**：electron-builder.yml 的 extraResources 依赖
#      「内核与本仓库同级」这个相对布局（见该文件头部说明）。内核是公开仓库，不需要额外凭据。
#   ② 冒烟用本项目自己的开关 MINGDAO_TCM_DESKTOP_SMOKE（内核那个是 MINGDAO_DESKTOP_SMOKE）。
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # 发 Release 需要

jobs:
  # ── 发版前审计：**不过就不构建** ───────────────────────────────────────────
  # 为什么要设在 CI 里而不是靠人记得跑：本项目连续几次"发布才发现"的失败都是
  # 「本机跑不出来、只有打包/装机才暴露」那一类。人一定会忘，机器不会。
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MingDaoTCM/MingDao-Harness
          path: kernel
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 审计（门禁 + 打包布局 + 装机配置）
        env:
          MINGDAO_KERNEL: ${{ github.workspace }}/kernel
        run: node tools/preflight.mjs --quick

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
            name: linux-x64
          - os: windows-latest
            args: --win nsis
            name: win-x64
          # 与上游同口径：macos-13（Intel）公共池排队数小时，改用 macos-14(arm64) + Rosetta 交叉构建 x64
          # zip 供自动更新（若将来接入），dmg 供手动安装
          - os: macos-14
            args: --mac dmg zip --x64
            name: mac-x64
          - os: macos-14
            args: --mac dmg zip
            name: mac-arm64
    runs-on: ${{ matrix.os }}
    env:
      # 代码签名/公证（可选）：仓库 Secrets 配了就生效，没配就出未签名产物
      # 需要的 Secrets 名与上游完全一致：CSC_LINK / CSC_KEY_PASSWORD（+ macOS 公证三件套
      # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID；Windows 走 Azure Trusted Signing 的 AZURE_*）
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout（本仓库 → tcm/）
        uses: actions/checkout@v4
        with:
          path: tcm

      # 必须与本仓库**同级**：electron-builder.yml 里 extraResources 的
      # `from: ../../../../MingDao-Harness/src` 就靠这个布局（打包后落到 resources/kernel/）
      - name: Checkout（内核 → MingDao-Harness/，与 tcm/ 同级）
        uses: actions/checkout@v4
        with:
          repository: MingDaoTCM/MingDao-Harness
          path: MingDao-Harness

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 版本号对齐 tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: tcm/tools/tcm-ui/desktop
        shell: bash
        run: |
          V="${{ github.ref_name }}"; V="${V#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$V"
          echo "版本号 → $V"

      - name: 安装 Electron 依赖（npmmirror 镜像）
        working-directory: tcm/tools/tcm-ui/desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --no-audit --no-fund

      - name: 打包
        working-directory: tcm/tools/tcm-ui/desktop
        shell: bash
        run: |
          # 未配置的 Secrets 会被 Actions 替换成**空字符串**，而 electron-builder 把空串
          # 当成有效证书路径 → 构建直接报错。先清掉真·空的（上游踩过，照抄）。
          for k in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!k}" ]; then unset "$k"; fi
          done
          # Apple 证书只给 macOS 用：非 macOS 腿强制清空 CSC_*，
          # 否则 electron-builder 会拿 Apple 证书给 Windows exe 做 Authenticode「签名」（比不签更糟）
          if [ "$RUNNER_OS" != "macOS" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npx electron-builder ${{ matrix.args }} --publish never

      # 打包冒烟：真跑**打包产物**的主进程（xvfb 无窗口）。它会把内置内核与问诊台都拉起来，
      # 起得来才算"这个包真的能双击"。只跑 Linux 腿：路径/导入类错误平台无关，一个平台足以拦截。
      - name: 打包冒烟（主进程模块求值 + 内核&问诊台起来，xvfb）
        if: runner.os == 'Linux'
        shell: bash
        env:
          MINGDAO_TCM_DESKTOP_SMOKE: '1'
          MINGDAO_HOME: ${{ runner.temp }}/mingdao-home
        run: |
          cd tcm/tools/tcm-ui/desktop
          test -x dist/linux-unpacked/mingdao-tcm || { echo "缺少 dist/linux-unpacked/mingdao-tcm"; ls -la dist; exit 1; }
          # 内核首启会在 MINGDAO_HOME 建最小配置 —— 目录得先存在，否则它写不进去
          mkdir -p "$MINGDAO_HOME"
          # 输出留档：自动更新若加载不了会被静默降级成"手动检查"（最该防的失效），这里当场抓
          xvfb-run -a dist/linux-unpacked/mingdao-tcm --no-sandbox 2>&1 | tee /tmp/smoke.out
          if grep -q 'electron-updater 不可用' /tmp/smoke.out; then
            echo "::error title=no-updater::打包产物里加载不到 electron-updater（自动更新会退化成手动检查）"
            exit 1
          fi
          grep -q MINGDAO_TCM_DESKTOP_SMOKE_OK /tmp/smoke.out || { echo "::error title=smoke::未看到 SMOKE_OK"; exit 1; }

      # ── 直接推给站点与 Release（**不再用工件中转**）────────────────────────────
      # 为什么去掉工件：工件只是 build→publish 的搬运工，却要占仓库配额 ——
      # 实测一次发版 ~3.6GB，几条腿跑下来把配额撑爆，四条腿全挂在 upload-artifact、
      # publish 被 skip（报 `Artifact storage quota has been hit`）。改成每条腿自己推，
      # 顺带把"跑完五条腿才发版"变成"每条腿落地即发布"。
      # 构建腿**只发 GitHub Release**（GitHub 内部传输很快、不会超时）。
      # 站点推送挪到 publish 作业、**单条流串行**：2026-09-30 实测四条腿同时往站点推，
      # 把服务器那条 ~100KB/s 的窄带打满，SSH 直接 `Connection reset by peer`（退出码 255）。
      # 单条流才不会互相挤（v0.1.5 能成功，正是因为当时推送在单独的 publish 作业里）。
      - name: 发本平台安装包到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          cd tcm/tools/tcm-ui/desktop/dist
          # 不用 mapfile：macOS runner 是 bash 3.2。排除 macOS 的 AppleDouble 垃圾（._xxx.dmg）。
          FILES=()
          # latest*.yml 是 electron-updater 的更新元数据，必须随包一起发（自动更新要读它）
          while IFS= read -r f; do FILES+=("$f"); done < <(ls -1 *.AppImage *.deb *.exe *.dmg *.zip latest*.yml 2>/dev/null | grep -v '^\._' | sort -u)
          if [ "${#FILES[@]}" -eq 0 ]; then echo "::error title=no-artifacts::本腿没有产物"; exit 1; fi
          echo "本腿产物："; printf '  %s\n' "${FILES[@]}"
          REPO="$GITHUB_REPOSITORY"; TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$REPO" --generate-notes --title "$TAG" >/dev/null 2>&1 || true
          gh release upload "$TAG" "${FILES[@]}" -R "$REPO" --clobber
          echo "  已上传 Release"

  # 汇总校验：四条腿各自发布完之后，确认 Release 资产齐、站点清单是终态。
  # 这里**不需要工件**（那正是被配额打挂的东西），只看两边落地结果。
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 推站点（单条流）+ 校验
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
          TCM_SSH_KEY: ${{ secrets.TCM_DEPLOY_SSH_KEY }}
          TCM_TARGET: ${{ vars.TCM_DEPLOY_TARGET }}
        shell: bash
        run: |
          set -uo pipefail
          TAG="$GITHUB_REF_NAME"; REPO="$GITHUB_REPOSITORY"

          # ① 校验 Release 资产（构建腿的唯一职责）
          gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' | sed 's/^/  /'
          N=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets|length')
          echo "  Release 资产共 $N 个"
          [ "$N" -ge 5 ] || { echo "::error title=release-assets::Release 资产过少（$N 个）"; exit 1; }
          # 自动更新依赖 latest*.yml —— 少了它，客户端永远"已是最新"（静默失效）
          gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' | grep -q '^latest' \
            || { echo "::error title=no-update-meta::Release 里没有 latest*.yml，自动更新不可用"; exit 1; }

          if [ -z "${TCM_SSH_KEY:-}" ]; then
            echo "::notice::未配置 TCM_DEPLOY_SSH_KEY，跳过站点推送（可用 site/deploy.sh 补）"; exit 0
          fi

          # ② 从 Release 下载（GitHub → runner 很快，不占工件配额），**一条流**推到站点
          DL="$(mktemp -d)"
          gh release download "$TAG" -R "$REPO" -D "$DL"
          # 只丢弃 blockmap（增量更新用，站点不需要）；**latest*.yml 必须留着** ——
          # 那是 electron-updater 的更新元数据，删了客户端就永远"已是最新"（静默失效）。
          # 这行原本连着 *.yml 一起删，2026-10-01 实测把自动更新整条链路废掉。
          rm -f "$DL"/*.blockmap 2>/dev/null || true
          # 页面只按 dmg/exe/deb/AppImage 展示；zip 是自动更新用的，白占慢带宽（仍在 Release 里）
          SITE_FILES=()
          # 站点推：安装包（不含 zip）+ 更新元数据 latest*.yml（自动更新要从站点读）
          while IFS= read -r f; do case "$f" in *.zip) ;; *) SITE_FILES+=("$f");; esac; done < <(ls -1 "$DL" | sort)
          printf '  推站点：\n'; printf '    %s\n' "${SITE_FILES[@]}"

          TARGET="${TCM_TARGET:-root@8.210.103.117}"; HOST="${TARGET#*@}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TCM_SSH_KEY" > ~/.ssh/id_tcm && chmod 600 ~/.ssh/id_tcm
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSHOPT="-i $HOME/.ssh/id_tcm -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30"
          ssh $SSHOPT "$TARGET" 'mkdir -p /opt/1panel/www/sites/tcm-site/downloads'
          # 清掉其它版本（find -delete 不经 shell 分词；产物名里没有 v，故用去 v 的版本号两端带 '-' 匹配）
          VER="${TAG#v}"
          ssh $SSHOPT "$TARGET" "cd /opt/1panel/www/sites/tcm-site/downloads && find . -maxdepth 1 -type f \\( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \\) ! -name '*-'$VER'-*' -delete ; rm -f manifest.json ; true"
          ( cd "$DL" && printf '%s\0' "${SITE_FILES[@]}" | tar -cf - --null --files-from=- ) \
            | ssh $SSHOPT "$TARGET" 'tar -xf - -C /opt/1panel/www/sites/tcm-site/downloads/ && ls -la /opt/1panel/www/sites/tcm-site/downloads/ | tail -9'
          # 让**服务器自己**重算 manifest（sha256/大小由服务器算，避免两边口径不一）
          scp -q $SSHOPT site/fetch-assets.py "$TARGET:/opt/mingdao/tcm-fetch-assets.py"
          # 写清单时**与 Release 的资产大小精确对账**：对不上（传了一半）就拒绝写 ——
          # 页面于是显示"尚未上传"，而不是提供一个装不上的包。
          # token 落 0600 临时文件、脚本读完即删（不进 argv/ps）。
          ssh $SSHOPT "$TARGET" "umask 077 && cat > /opt/mingdao/.tcm-token" <<<"$GH_TOKEN"
          ssh $SSHOPT "$TARGET" "python3 /opt/mingdao/tcm-fetch-assets.py --repo '$REPO' --tag '$TAG' --dir /opt/1panel/www/sites/tcm-site/downloads --manifest-only --token-file /opt/mingdao/.tcm-token"
          ssh $SSHOPT "$TARGET" "rm -f /opt/mingdao/.tcm-token" || true
          # 版本动态：把真实发版历史写到站点（页面据此渲染，不再手写必然过期的静态文案）
          gh release list -R "$REPO" --limit 20 --json tagName,publishedAt,name \
            | python3 -c "import sys,json;d=json.load(sys.stdin);json.dump({'versions':[{'version':x['tagName'].lstrip('v'),'at':x['publishedAt'],'name':x.get('name') or ''} for x in d]},sys.stdout,ensure_ascii=False,indent=2)" > "$DL/versions.json"
          scp -q $SSHOPT "$DL/versions.json" "$TARGET:/opt/1panel/www/sites/tcm-site/versions.json"
          echo "  已更新版本动态（$(python3 -c "import json;print(len(json.load(open('$DL/versions.json'))['versions']))") 条）"
          echo "站点版本端点："; curl -s -m 20 "https://tcm.mingdao.ai/api/latest" | sed 's/^/  /'
