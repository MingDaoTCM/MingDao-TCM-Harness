# tcm.mingdao.ai → 明道中医 · 问诊台（内部站点）
#
# 与官网（harness.mingdao.ai）同一台服务器、同一套 openresty 容器（1Panel）。
# 差别：官网是**静态直出**；本站是**动态**的 —— 密码门、改密码、安装包鉴权下载都在 Node 服务里，
# 所以这里只做反向代理。
#
# 落地位置：/opt/1panel/www/conf.d/tcm.conf
#   （宿主该目录 → 容器 /usr/local/openresty/nginx/conf/conf.d，由 nginx.conf 的 include 加载）
# 证书：acme.sh 签发后拷到 /opt/1panel/apps/openresty/openresty/conf/ssl/
#   （宿主该目录 → 容器 /usr/local/openresty/nginx/conf/ssl）

server {
    listen 443 ssl;
    http2 on;
    server_name tcm.mingdao.ai;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/tcm.mingdao.ai.crt;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/tcm.mingdao.ai.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 独立访问日志（与官网分开，便于统计本站自己的下载与访问）
    access_log /var/log/nginx/tcm.access.log main;

    # 登录请求很小；安装包走**下载**不由这里上传，所以不必放大
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8448;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 安装包 100MB 级：不缓冲，边收边发（否则先落盘再吐出，进度条会长时间不动）
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name tcm.mingdao.ai;
    # acme.sh 走 webroot 续期（与官网两站同口径）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
