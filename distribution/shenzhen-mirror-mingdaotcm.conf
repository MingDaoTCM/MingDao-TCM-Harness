# mingdaotcm.southdns.com → 国内镜像（深圳节点）
# 抄自同机上游镜像 harness-southdns.conf（DISTRIBUTION-PLAYBOOK §2 的四组件之一）。
# 分工：
#   /downloads/ → **本地优先**（有就直供，18MB/s）；没有就 302 到 OSS（香港桶）
#   /updates/   → 直通代理、不缓存（feed 必须每次新鲜，否则自动更新拿到旧版本号）
#   /           → 直通代理（页面与源站一致）
#   404 必须透传（否则重演"缺文件变成 200 + HTML"）
server {
    listen 80;
    server_name mingdaotcm.southdns.com;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mingdaotcm.southdns.com;

    ssl_certificate     /usr/local/openresty/nginx/conf/ssl/mingdaotcm.southdns.com/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/mingdaotcm.southdns.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MDH_SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 200m;

    location ^~ /downloads/ {
        root /www/mirror-downloads-tcm;
        try_files $uri @oss_downloads;
    }
    location @oss_downloads {
        return 302 https://mingdaotcm.oss-cn-hongkong.aliyuncs.com$request_uri;
    }

    location ^~ /updates/ {
        proxy_pass https://tcm.mingdao.ai;
        proxy_http_version 1.1;
        proxy_set_header Host tcm.mingdao.ai;
        add_header Cache-Control "no-store" always;
    }
    location = /stats.json {
        proxy_pass https://tcm.mingdao.ai;
        proxy_set_header Host tcm.mingdao.ai;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        proxy_pass https://tcm.mingdao.ai;
        proxy_http_version 1.1;
        proxy_set_header Host tcm.mingdao.ai;
        add_header Cache-Control "no-store" always;
    }
    location / {
        proxy_pass https://tcm.mingdao.ai;
        proxy_http_version 1.1;
        proxy_set_header Host tcm.mingdao.ai;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
