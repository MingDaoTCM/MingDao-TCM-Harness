# 明道中医 · 问诊台 桌面版 —— 打包配置
#
# 与内核自带 desktop/electron-builder.yml 同源（同品牌、同镜像、同产物形态），差别只有一处：
# 这里**要多带一份问诊台**（薄代理 + 前端），并把内核的 src 一起内置，做到"一次安装、双击可用"。
#
# 目录布局（关键）：extraResources 落盘后必须保持**相对结构**，因为 tcm-data.mjs 里有一句
# `../../layer/packs/tcm/pack.mjs` —— 所以把仓库里的 layer/ 与 tools/tcm-ui/ 按原样放进
# resources/app/，内核放进 resources/kernel/。
#   resources/app/layer/packs/tcm/**            ← 垂域 Pack（问诊台数据层 import 它）
#   resources/app/tools/tcm-ui/**               ← server.mjs / tcm-data.mjs / public/**
#   resources/kernel/src/**                     ← 内核（零运行时依赖）
# 运行期由 orchestrator.resolveAppRoot()/resolveKernelRoot() 解析到这两处。
appId: com.mingdao.tcm
productName: MingDao TCM
copyright: © 2026 MingDaoTCM

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - orchestrator.mjs
  - package.json
  - build/icon.png
  - build/tray.png

extraResources:
  # 问诊台 + 垂域层：保持仓库内的相对布局（见文件头的说明）
  #
  # ⚠ `layer/providers/**` 必须在这里 —— 2026-09-24 实测漏了它：
  #   打包产物里只有 Pack、没有 Dify Provider 模块 → 内核加载不到自定义 Provider
  #   → `provider: dify` 落入"服务商缺少 baseUrl"分支，桌面版直接起不来；
  #   而如果有人为了让它起来补一个 baseUrl，就变成"问诊绕过 Dify"（用户报的那件事）。
  #   一个 filter 少一行，表现是"装完不能用/用错"，而且**本机跑不出来**（本机是开发态，直接读仓库）。
  - from: ../../..
    to: app
    # 用**目录级** filter，不要逐个文件列举 —— 2026-09-24 连着栽了两次：
    #   先漏 `layer/providers/**`（产物没有 Dify Provider），后漏 `tools/tcm-ui/settings.mjs`
    #   （冒烟当场报 Cannot find module）。逐个列举等于"每次加文件都要记得改这里"，
    #   而漏掉的表现是装完起不来 / 静默少功能，本机还测不出来。
    filter:
      - layer/packs/tcm/**
      - layer/providers/**
      - tools/tcm-ui/**
      - '!tools/tcm-ui/test/**'
      # desktop/ 里**只有 Electron 主进程那几样**要排除。整目录排除是错的：
      # `desktop/orchestrator.mjs` 是**纯 Node**（有单测、不 import electron），
      # 而 UI 服务端 server.mjs 的「检查更新」正需要它的 checkForUpdate ——
      # 排除后该端点在打包产物里一跑就 ERR_MODULE_NOT_FOUND
      # （v0.1.15 实测："暂时查不到最新版本：Cannot find module .../tools/tcm-ui/desktop/orchestrator.mjs"）。
      - '!tools/tcm-ui/desktop/main.js'
      - '!tools/tcm-ui/desktop/node_modules/**'
      - '!tools/tcm-ui/desktop/build/**'
      - '!tools/tcm-ui/desktop/electron-builder.yml'
  # 内核：默认取工作区同级的 MingDao-Harness
  - from: ../../../../MingDao-Harness/src
    to: kernel/src
  # ⚠ 内核的 package.json 必须一起带 —— 内核版本由 `coreVersionOf()` 从
  #   `<kernelRoot>/package.json` 读（src/packs.js）。只带 src/ 时它是 **0.0.0**
  #   → 垂域 Pack 的 `engines.mingdao: ">=0.5 <0.7"` 校验失败 → **Pack 被静默跳过**
  #   （CI 冒烟实测：`Pack "tcm" 校验失败（已跳过）…不匹配当前内核 0.0.0`）
  #   → 桌面版没有 tcm 工具，问诊也不会走 Dify。少一个文件，整个垂域层失效。
  - from: ../../../../MingDao-Harness/package.json
    to: kernel/package.json
  # 若内核不在默认位置，可改用环境变量（electron-builder 支持 ${env.X}）：
  # - from: ${env.MINGDAO_KERNEL}/src
  #   to: kernel/src

# 自动更新源：站点上的 downloads/（与安装包同目录，放 electron-builder 生成的 latest*.yml）。
# 必须是**站点**而不是 GitHub —— 仓库是私有的，客户端读不到 Release。
publish:
  provider: generic
  url: https://tcm.mingdao.ai/downloads/

asar: true
npmRebuild: false

# 国内下载 electron 走镜像（与内核 desktop/ 一致，否则打包会卡在下载）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

linux:
  executableName: mingdao-tcm
  target:
    - AppImage
    - deb
  icon: build/icons
  category: Utility
  maintainer: MingDaoTCM
  artifactName: mingdao-tcm-${version}-${arch}.${ext}

win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: MingDao TCM
  artifactName: mingdao-tcm-setup-${version}-${arch}.${ext}

mac:
  target:
    - dmg
    - zip # 自动更新需要 zip（将来接入 electron-updater 时）；dmg 供手动安装
  # 显式命名，**不用默认的 productName 前缀**：默认会给 zip 起出
  # "MingDao TCM-0.1.3-x64-mac.zip"（带空格）—— 空格在 URL 里要转义、在 shell 里要引号，
  # 而 GitHub 上传时还会把空格悄悄改成点（同一个包在两边名字不一样）。
  # 统一成 mingdao-tcm-<版本>-<架构>.<ext>，与 Linux/Windows 产物一致。
  artifactName: mingdao-tcm-${version}-${arch}.${ext}
  category: public.app-category.medical
  icon: build/icon.png
  # 签名 + 公证：CI 里由 Secrets 驱动（CSC_LINK / CSC_KEY_PASSWORD 自动签名；
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD 走 notarytool 公证并 stapling）。
  # 未配置 Secrets 时这些字段不生效 → 构建回退未签名产物（行为与上游一致）。
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 与上游同一个 Apple 团队（MingDaoTCM）。换账号要改这里 ——
  # electron-builder 24.x 不读 APPLE_TEAM_ID 环境变量，notarytool 只认配置文件里的值。
  notarize:
    teamId: 3VZLHJCG48

