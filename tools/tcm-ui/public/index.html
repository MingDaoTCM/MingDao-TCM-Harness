<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>得一中医 · 问诊台</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
    --fg:#e6edf3; --dim:#9aa7b4; --faint:#6b7784;
    --accent:#3fb950; --accent2:#58a6ff; --warn:#d29922; --err:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header b{font-size:15px}
  header .tag{font-size:12px;color:var(--faint)}
  header .sp{flex:1}
  header .st{font-size:12px;color:var(--dim)}
  main{display:flex;height:calc(100vh - 49px)}
  aside{width:400px;min-width:400px;border-right:1px solid var(--line);overflow-y:auto;padding:14px;background:var(--panel)}
  section.chat{flex:1;display:flex;flex-direction:column;min-width:0}
  h3{margin:14px 0 8px;font-size:12.5px;color:var(--dim)}
  h3:first-child{margin-top:0}
  h3 .req{color:var(--err);font-size:11px;margin-left:4px}
  h3 .opt{color:var(--faint);font-size:11px;margin-left:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  label{display:block;font-size:12px;color:var(--faint);margin:0 0 3px}
  input[type=text],textarea,select{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--fg);
    padding:7px 9px;font:13px/1.5 inherit;outline:none
  }
  input:focus,textarea:focus{border-color:var(--accent2)}
  textarea{resize:vertical;min-height:50px}
  .field{margin-bottom:9px}
  .row{display:flex;gap:8px;margin-top:12px}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 12px;font:13px inherit;cursor:pointer}
  button:hover{border-color:var(--accent2)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04120a;font-weight:600}
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent}
  #thumb{max-width:100%;margin-top:6px;border-radius:6px;border:1px solid var(--line);display:none}
  .conv{flex:1;overflow-y:auto;padding:16px 18px}
  .turn{max-width:min(900px,100%);margin:0 0 18px}
  .q{background:#1f6feb22;border:1px solid #1f6feb55;border-radius:10px;padding:9px 12px;white-space:pre-wrap;font-size:13px}
  .q .who{font-size:11.5px;color:var(--faint);margin-bottom:3px}
  /* 工具区固定在上、问诊正文固定在下 —— 与事件到达顺序无关 */
  .toolzone{margin:8px 0 0}
  .toolzone .zt{font-size:11.5px;color:var(--faint);margin:2px 0 5px}
  .tool{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:5px 0;font-size:12.5px}
  .tool .head{display:flex;gap:8px;align-items:center;padding:6px 10px}
  .tool .name{color:var(--accent2)}
  .tool .raw{font-family:ui-monospace,Menlo,monospace;color:var(--faint);font-size:11px}
  .tool .st{margin-left:auto;color:var(--dim);white-space:nowrap}
  .tool .st.ok{color:var(--accent)} .tool .st.bad{color:var(--err)}
  .tool pre{margin:0;padding:0 10px 9px;white-space:pre-wrap;color:var(--dim);font:12px/1.55 ui-monospace,Menlo,monospace;max-height:230px;overflow:auto}
  .answer{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .answer .zt{font-size:11.5px;color:var(--faint);margin-bottom:5px}
  .answer .body{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;white-space:pre-wrap}
  .answer .body.pending::after{content:'▌';animation:blink 1.1s infinite;color:var(--accent2)}
  .banner{padding:7px 11px;border-radius:6px;background:#d2992222;border:1px solid #d2992255;color:var(--warn);font-size:12.5px;margin:0 0 10px}
  .errline{padding:7px 11px;border-radius:6px;background:#f8514922;border:1px solid #f8514955;color:var(--err);font-size:12.5px;margin:6px 0}
  .composer{border-top:1px solid var(--line);padding:10px 16px;background:var(--panel);display:flex;gap:8px;align-items:flex-end}
  .composer textarea{min-height:44px;max-height:170px}
  .hint{font-size:11.5px;color:var(--faint);padding:0 16px 10px;background:var(--panel)}
  .spin{animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.35}}
</style>
</head>
<body>
<header>
  <b>得一中医 · 问诊台</b>
  <span class="tag">独立前端 · 薄代理（内核零改动）</span>
  <span class="sp"></span>
  <span class="st" id="st">未连接</span>
</header>

<main>
  <aside>
    <h3>患者资料</h3>
    <div class="grid">
      <div><label>姓名</label><input id="pName" type="text" placeholder="张三" /></div>
      <div><label>出生年</label><input id="pBirth" type="text" placeholder="1985" /></div>
      <div><label>性别</label>
        <select id="pSex"><option value="">—</option><option>男</option><option>女</option></select>
      </div>
      <div><label>就诊类型</label>
        <select id="pKind"><option value="auto">自动判断</option><option value="first">首诊</option><option value="follow">复诊</option></select>
      </div>
    </div>
    <div style="font-size:11.5px;color:var(--faint);margin-top:6px">
      病历号不用填 —— <b>复诊自动提取历史病历号，初诊由系统自动分配</b>；
      同名多命中时系统会把候选交给你确认，不会自己挑一个。
    </div>

    <h3>主诉<span class="req">必填</span></h3>
    <div class="field"><textarea id="f_zhushu" placeholder="失眠多梦三个月"></textarea></div>

    <h3>现病史<span class="req">必填</span></h3>
    <div class="field"><textarea id="f_xianbingshi" placeholder="三月前无诱因出现入睡困难，伴多梦易醒；未系统治疗…"></textarea></div>

    <h3>既往史 · 家族史 · 过敏史 · 流行病史<span class="opt">可选</span></h3>
    <div class="field"><label>既往史</label><textarea id="f_jiwangshi" placeholder="高血压十年；2024 年宫颈癌术后"></textarea></div>
    <div class="field"><label>家族史</label><input id="f_jiazushi" type="text" placeholder="母亲有高血压" /></div>
    <div class="field"><label>过敏史</label><input id="f_guominshi" type="text" placeholder="青霉素过敏" /></div>
    <div class="field"><label>流行病史</label><input id="f_liuxingbingshi" type="text" placeholder="否认疫区接触" /></div>

    <h3>体格检查<span class="opt">可选</span></h3>
    <div class="field"><textarea id="f_tigejiancha" placeholder="T 36.5℃ P 78次/分 R 18次/分 BP 138/86mmHg"></textarea></div>

    <h3>四诊 · 舌象 / 脉象<span class="opt">可选</span></h3>
    <div class="field"><label>舌象（望诊）</label><input id="f_shexiang" type="text" placeholder="舌红苔黄" /></div>
    <div class="field">
      <label>舌象照片（拍照或选图，随问诊一起交给 Dify）</label>
      <input id="tongue" type="file" accept="image/*" capture="environment" />
      <img id="thumb" alt="舌象预览" />
      <div id="tongueTip" style="font-size:11.5px;color:var(--faint);margin-top:4px"></div>
    </div>
    <div class="field"><label>脉象（切诊，医师指下所得）</label><input id="f_maixiang" type="text" placeholder="脉弦细" /></div>

    <h3>随访<span class="opt">可选</span></h3>
    <div class="field"><textarea id="f_suifang" placeholder="两周后复诊；嘱记录睡眠日记"></textarea></div>

    <div class="row">
      <button class="primary" id="compose" style="flex:1">合成问诊消息 →</button>
      <button class="ghost" id="clearForm">清空</button>
    </div>
    <div style="font-size:11.5px;color:var(--faint);margin-top:8px">
      合成后填入右下输入框，<b>可再编辑</b>再发送 —— 不会替你做任何临床判断。
    </div>
  </aside>

  <section class="chat">
    <div class="conv" id="conv"></div>
    <div class="composer">
      <textarea id="input" placeholder="直接描述病情，或先在左侧填表后点「合成问诊消息」（Enter 发送 / Shift+Enter 换行）"></textarea>
      <button class="primary" id="send">发送</button>
      <button id="stop" style="display:none">停止</button>
    </div>
    <div class="hint" id="hint">每轮回复：上方是工具执行区，下方是问诊工作流正文。</div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** 工具注册名 → 医师看得懂的名字（把内核加的 pack__<pack>__ 前缀翻成人话） */
const TOOL_LABEL = {
  patient_lookup: '患者定位',
  patient_register: '新患者登记',
  intake_collect: '病历落盘',
  visit_compare: '复诊四态对比',
  followup_board: '回访 / 随访',
};
const toolLabel = (raw) => {
  const s = String(raw || '');
  const bare = s.startsWith('pack__') ? s.split('__').slice(2).join('__') : s;
  return TOOL_LABEL[bare] || bare;
};

let session = null;
let generating = false;
let ctrl = null;
let pendingAttachments = [];

// ── 舌象照片 ──────────────────────────────────────────────
$('#tongue').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  const tip = $('#tongueTip'); const thumb = $('#thumb');
  pendingAttachments = [];
  if (!f) { thumb.style.display = 'none'; tip.textContent = ''; return; }
  if (!/^image\//.test(f.type)) { tip.textContent = '只支持图片文件'; return; }
  const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.readAsDataURL(f); });
  if (dataUrl.length > 7 * 1024 * 1024) { tip.textContent = '图片过大（内核限制单张 ≤5MB）'; return; }
  pendingAttachments = [{ type: 'image', name: f.name || '舌象.jpg', dataUrl }];
  thumb.src = dataUrl; thumb.style.display = 'block';
  tip.textContent = '已附上 —— 发送时内核会把照片交给 Dify 工作流（Dify 侧需开启视觉）。';
});

// ── 合成问诊消息 ──────────────────────────────────────────
const OPT_FIELDS = [
  ['jiwangshi', '既往史'], ['jiazushi', '家族史'], ['guominshi', '过敏史'], ['liuxingbingshi', '流行病史'],
  ['tigejiancha', '体格检查'], ['shexiang', '舌象'], ['maixiang', '脉象'], ['suifang', '随访'],
];
$('#compose').onclick = () => {
  const name = $('#pName').value.trim();
  const birth = $('#pBirth').value.trim();
  const sex = $('#pSex').value;
  const kind = $('#pKind').value;
  const head = [];
  if (name) head.push(name);
  if (birth) head.push(birth + '年生');
  if (sex) head.push(sex);
  const lines = [];
  const prefix = kind === 'follow' ? '复诊' : (kind === 'first' ? '首诊' : '');
  if (head.length || prefix) lines.push((prefix ? prefix + '：' : '') + head.join('，') + '。');
  const zhushu = $('#f_zhushu').value.trim();
  const xbs = $('#f_xianbingshi').value.trim();
  if (zhushu) lines.push('主诉：' + zhushu);
  if (xbs) lines.push('现病史：' + xbs);
  for (const [key, label] of OPT_FIELDS) {
    const v = ($('#f_' + key)?.value || '').trim();
    if (v) lines.push(label + '：' + v);
  }
  if (pendingAttachments.length) lines.push('（舌象照片见附件）');
  if (kind === 'follow') lines.push('（复诊：请回顾上次并逐项对比本次变化）');
  $('#input').value = lines.filter(Boolean).join('\n');
  $('#input').focus();
};

$('#clearForm').onclick = () => {
  for (const id of ['f_zhushu', 'f_xianbingshi', ...OPT_FIELDS.map(([k]) => 'f_' + k)]) { const el = $('#' + id); if (el) el.value = ''; }
  for (const id of ['pName', 'pBirth']) $('#' + id).value = '';
  $('#pSex').value = ''; $('#pKind').value = 'auto';
  $('#tongue').value = ''; $('#thumb').style.display = 'none'; $('#tongueTip').textContent = '';
  pendingAttachments = [];
};

// ── 每轮回复：工具区（上） + 问诊正文（下） ─────────────────
function addTurn(userText, hasAttachment) {
  const turn = document.createElement('div');
  turn.className = 'turn';
  turn.innerHTML = '<div class="q"><div class="who">医师' + (hasAttachment ? ' · 附舌象照片' : '') + '</div>' + esc(userText) + '</div>'
    + '<div class="toolzone" style="display:none"><div class="zt">工具执行</div><div class="cards"></div></div>'
    + '<div class="answer"><div class="zt">问诊工作流正文</div><div class="body pending"></div></div>';
  $('#conv').appendChild(turn);
  scroll();
  return turn;
}
function toolCard(turn, rawName) {
  const zone = turn.querySelector('.toolzone');
  const cards = turn.querySelector('.cards');
  zone.style.display = '';
  const d = document.createElement('div');
  d.className = 'tool';
  d.innerHTML = '<div class="head"><span>🔧</span><span class="name">' + esc(toolLabel(rawName))
    + '</span><span class="raw">' + esc(rawName) + '</span>'
    + '<span class="st"><span class="spin">执行中…</span></span></div>';
  cards.appendChild(d);
  scroll();
  return d;
}
function scroll() { const c = $('#conv'); c.scrollTop = c.scrollHeight; }

async function send(text, attachments) {
  if (generating) return;
  text = String(text || '').trim();
  if (!text) return;
  generating = true; $('#send').disabled = true; $('#stop').style.display = '';
  const turn = addTurn(text, Boolean(attachments && attachments.length));
  const body = turn.querySelector('.answer .body');
  const cards = new Map();
  let raw = '';
  ctrl = new AbortController();

  const payload = { message: text };
  if (session) payload.file = session;
  if (attachments && attachments.length) payload.attachments = attachments;

  try {
    const resp = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: ctrl.signal });
    if (!resp.ok) {
      const j = await resp.json().catch(() => ({}));
      body.classList.remove('pending');
      body.innerHTML = '<div class="errline">' + esc(j.error || ('HTTP ' + resp.status)) + '</div>';
      return;
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of block.split('\n')) {
          if (!line.startsWith('data:')) continue;
          let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
          handleEvent(ev, turn, body, cards, (t) => { raw += t; body.textContent = raw; scroll(); });
        }
      }
    }
  } catch (e) {
    if (String(e?.name) !== 'AbortError') body.innerHTML += '<div class="errline">连接失败：' + esc(e?.message || e) + '</div>';
  } finally {
    body.classList.remove('pending');
    generating = false; $('#send').disabled = false; $('#stop').style.display = 'none'; ctrl = null;
  }
}

async function handleEvent(ev, turn, body, cards, pushText) {
  switch (ev.type) {
    case 'text': pushText(String(ev.delta || '')); break;
    case 'reasoning': break;
    case 'toolStart': cards.set(ev.seq, toolCard(turn, ev.name)); break;
    case 'tool': {
      const card = cards.get(ev.seq) || toolCard(turn, ev.name);
      const r = ev.result || {};
      const ok = r.ok !== false;
      const st = card.querySelector('.st');
      st.className = 'st ' + (ok ? 'ok' : 'bad');
      st.textContent = (ok ? '✓' : '✖') + (ev.durationMs != null ? ' ' + ev.durationMs + 'ms' : '');
      if (r.output) { const pre = document.createElement('pre'); pre.textContent = String(r.output).slice(0, 2000); card.appendChild(pre); }
      if (r.error) { const pre = document.createElement('pre'); pre.style.color = 'var(--err)'; pre.textContent = String(r.error); card.appendChild(pre); }
      scroll();
      break;
    }
    case 'toolDenied': {
      const d = document.createElement('div'); d.className = 'errline';
      d.textContent = '✖ 工具未执行：' + (ev.reason || '未授权') + '（' + toolLabel(ev.name) + '）';
      const zone = turn.querySelector('.toolzone'); zone.style.display = '';
      turn.querySelector('.cards').appendChild(d); scroll();
      break;
    }
    case 'banner': {
      const d = document.createElement('div'); d.className = 'banner'; d.textContent = ev.text || '';
      turn.insertBefore(d, turn.firstChild); scroll();
      break;
    }
    case 'ask': {
      const yes = window.confirm(ev.question || '是否允许该操作？');
      await fetch('/api/permission', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: ev.id, answer: yes ? 'y' : 'n', taskId: ev.taskId }) }).catch(() => {});
      break;
    }
    case 'error': {
      const d = document.createElement('div'); d.className = 'errline'; d.textContent = ev.message || '出错了';
      turn.appendChild(d); scroll();
      break;
    }
    case 'done': {
      if (ev.session) { session = ev.session; $('#hint').textContent = '会话：' + session + '（后续消息沿用同一上下文）'; }
      if (ev.note) { const d = document.createElement('div'); d.className = 'errline'; d.style.color = 'var(--warn)'; d.textContent = ev.note; turn.appendChild(d); }
      const u = ev.usage || {};
      if (u.completion_tokens || u.prompt_tokens) {
        $('#st').textContent = '本轮 ' + (u.prompt_tokens || 0) + '+' + (u.completion_tokens || 0) + ' tokens'
          + (ev.durationMs ? ' · ' + (ev.durationMs / 1000).toFixed(1) + 's' : '');
      }
      scroll();
      break;
    }
    default: break;
  }
}

$('#send').onclick = () => {
  const t = $('#input').value;
  const att = pendingAttachments.slice();
  $('#input').value = '';
  if (att.length) { pendingAttachments = []; $('#tongue').value = ''; $('#thumb').style.display = 'none'; $('#tongueTip').textContent = ''; }
  send(t, att);
};
$('#stop').onclick = () => { try { ctrl?.abort(); } catch {} fetch('/api/abort', { method: 'POST' }).catch(() => {}); };
$('#input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#send').click(); } });

fetch('/api/state').then((r) => { $('#st').textContent = r.ok ? '内核已连接' : '内核异常 ' + r.status; }).catch(() => { $('#st').textContent = '内核不可达'; });
</script>
</body>
</html>
